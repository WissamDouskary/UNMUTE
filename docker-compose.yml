services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: unmute-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unmute}
      POSTGRES_USER: ${POSTGRES_USER:-unmute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - unmute-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unmute} -d ${POSTGRES_DB:-unmute}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - unmute-network

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unmute-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-unmute}
      POSTGRES_USER: ${POSTGRES_USER:-unmute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-that-is-at-least-64-characters-long-replace-in-production!!}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-900}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800}
      # AI providers: set the keys in .env (never commit it). Empty keys fall back to offline mocks.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-auto}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-auto}
      AI_TRANSCRIPTION_PROVIDER: ${AI_TRANSCRIPTION_PROVIDER:-auto}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-2.5-flash}
      AI_AUTO_TAG_ENABLED: ${AI_AUTO_TAG_ENABLED:-true}
    volumes:
      # Pending transcription jobs need their audio after a rebuild or crash.
      - unmute-uploads:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - unmute-network

  # ── React Web (Vite Dev Server) ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: unmute-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - ./packages/api-client:/app/packages/api-client
    networks:
      - unmute-network

volumes:
  unmute-pgdata:
    name: unmute-pgdata
  unmute-uploads:
    name: unmute-uploads

networks:
  unmute-network:
    name: unmute-network
    driver: bridge
