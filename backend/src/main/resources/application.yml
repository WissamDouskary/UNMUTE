server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: unmute

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:unmute}
    username: ${POSTGRES_USER:unmute}
    password: ${POSTGRES_PASSWORD:changeme_dev_only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

unmute:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-that-is-at-least-64-characters-long-replace-in-production!!}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}
