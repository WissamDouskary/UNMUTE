server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: unmute

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:unmute}
    username: ${POSTGRES_USER:unmute}
    password: ${POSTGRES_PASSWORD:changeme_dev_only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # Matches the OpenAI transcription API limit; larger files would fail later in the pipeline.
      max-file-size: 25MB
      max-request-size: 26MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

unmute:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-that-is-at-least-64-characters-long-replace-in-production!!}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}

  web:
    origin: ${WEB_ORIGIN:http://localhost:3000}

  # Blank client id keeps Calendar disconnected. The encryption key is required only when a client id is set.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:}
    webhook-url: ${GOOGLE_CALENDAR_WEBHOOK_URL:}

  jobs:
    worker-enabled: ${JOBS_WORKER_ENABLED:true}
    concurrency: ${JOBS_CONCURRENCY:4}

  # Per-process token buckets. A restart clears them. Keys are a user id or a client address, never a body or token.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-keys: ${RATE_LIMIT_MAX_KEYS:10000}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      window: ${RATE_LIMIT_AUTH_WINDOW:PT1M}
    ai:
      capacity: ${RATE_LIMIT_AI_CAPACITY:20}
      window: ${RATE_LIMIT_AI_WINDOW:PT1M}
    upload:
      capacity: ${RATE_LIMIT_UPLOAD_CAPACITY:30}
      window: ${RATE_LIMIT_UPLOAD_WINDOW:PT1M}

  # Keys are read from the environment only (.env via docker compose) and are never logged.
  # "auto" uses a real provider whenever its key is set and falls back to offline mocks otherwise.
  ai:
    llm-provider: ${AI_LLM_PROVIDER:auto}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:auto}
    transcription-provider: ${AI_TRANSCRIPTION_PROVIDER:auto}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:whisper-1}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
      effort: ${ANTHROPIC_EFFORT:medium}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      native-base-url: ${GEMINI_NATIVE_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      transcription-model: ${GEMINI_TRANSCRIPTION_MODEL:gemini-3.8-flash}
    auto-tag:
      enabled: ${AI_AUTO_TAG_ENABLED:true}
    rag:
      # min-similarity defaults to the active embedding model's calibrated floor; set it to override.
      relative-cutoff: ${AI_RAG_RELATIVE_CUTOFF:0.6}
