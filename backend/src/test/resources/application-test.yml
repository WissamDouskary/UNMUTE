# Test profile — uses H2 in-memory database for fast unit/integration tests
spring:
  datasource:
    url: jdbc:h2:mem:unmute_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

unmute:
  rate-limit:
    # High enough that the rest of the suite does not trip the limiter. RateLimitIntegrationTest lowers it.
    auth:
      capacity: 1000
    ai:
      capacity: 1000
    upload:
      capacity: 1000
  jobs:
    # Tests run due jobs deterministically with JobWorker#drain.
    worker-enabled: false
  ai:
    # Never call real APIs from tests, even if a developer has keys in their environment.
    llm-provider: mock
    embedding-provider: mock
    transcription-provider: mock
  jwt:
    secret: test-secret-that-is-at-least-64-characters-long-for-hmac-sha-key-validation!!
    access-token-expiry: 900
    refresh-token-expiry: 604800
